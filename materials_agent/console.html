<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>材料计算工作台</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    --canvas: #e8eff9;
    --light: #f8faff;
    --aurora: #cbd9ff;
    --wash: #d5efee;
    --ink: #172540;
    --muted: #4e5e76;
    --accent: #2949aa;
    --action: #304fc1;
    --surface: #f7faffed;
    --field: #f0f4fc;
    --glass: #edf3ffe0;
    --edge: #b6c7e266;
    --shine: #ffffffb5;
    --shadow: #1e376a17;
    --positive: #17654f;
    --positive-bg: #dcf3eb;
    --warn: #795019;
    --warn-bg: #f9ecd6;
    --danger: #942d43;
    --danger-bg: #f9e2e8;
    --ease: cubic-bezier(.2, .8, .25, 1);
    color: var(--ink);
    background: var(--canvas);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 94px; scroll-behavior: smooth; }
  body {
    min-height: 100vh; margin: 0; padding-bottom: env(safe-area-inset-bottom);
    background: radial-gradient(ellipse at 80% 0%, var(--aurora), transparent 48%),
                radial-gradient(ellipse at 9% 20%, var(--wash), transparent 42%),
                linear-gradient(160deg, var(--light), var(--canvas) 60%);
  }
  header { position: sticky; top: 0; z-index: 2; padding: 13px 0 0; }
  nav, main { width: min(calc(100% - 56px), 1140px); margin-inline: auto; }
  nav {
    min-height: 56px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 5px 8px 5px 14px; border-radius: 24px;
    background: var(--glass); backdrop-filter: blur(23px) saturate(155%);
    border: 1px solid var(--shine); box-shadow: 0 8px 30px var(--shadow), inset 0 1px var(--shine);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .nav-actions { display: flex; gap: 5px; }
  .brand strong { font-size: 14px; letter-spacing: -.02em; }
  .brand-mark {
    width: 29px; height: 29px; border-radius: 10px; transform: rotate(-8deg);
    background: radial-gradient(circle at 36% 25%, #f0fbff, #92a6fb 41%, #3856c0 86%);
    box-shadow: inset 0 1px 2px #fff9, 0 2px 7px #374ca34d;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  nav a, .download {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px;
    background: var(--field); border: 1px solid var(--edge); border-radius: 999px;
    font-size: 13px; font-weight: 650; text-decoration: none;
  }
  main { padding-block: 46px 56px; }
  .intro { margin-bottom: 27px; }
  h1 { font-size: clamp(31px, 5vw, 54px); line-height: 1.1; letter-spacing: -.055em; margin: 0 0 11px; }
  h2 { font-size: 20px; letter-spacing: -.02em; margin: 0 0 19px; }
  h3 { font-size: 14px; margin: 20px 0 9px; }
  p { line-height: 1.65; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .intro .muted { font-size: 15px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 20px; align-items: start; }
  .panel {
    background: var(--surface); border: 1px solid var(--shine); padding: 23px;
    border-radius: 27px; min-width: 0; box-shadow: 0 11px 28px var(--shadow), inset 0 1px var(--shine);
  }
  .panel + .panel { margin-top: 16px; }
  #clarification, #result-panel { animation: reveal .31s var(--ease) both; }
  label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 7px; }
  textarea, select {
    width: 100%; color: inherit; font: inherit; font-size: 16px;
    background: var(--field); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 12px;
  }
  textarea { min-height: 108px; resize: vertical; display: block; }
  textarea::placeholder { color: var(--muted); }
  select { min-height: 44px; }
  select:disabled { opacity: .62; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 21px; }
  button {
    font: inherit; font-weight: 650; cursor: pointer; border: 1px solid var(--edge);
    background: var(--field); color: var(--accent); padding: 8px 13px; border-radius: 999px; min-height: 44px;
  }
  button, nav a, .download { transition: transform .22s var(--ease), box-shadow .22s var(--ease); }
  button:active:not(:disabled), nav a:active, .download:active { transform: scale(.96); }
  @media (hover: hover) {
    button:hover:not(:disabled), nav a:hover, .download:hover { box-shadow: 0 3px 10px var(--shadow), inset 0 1px var(--shine); }
  }
  button:disabled { opacity: .65; cursor: wait; }
  .primary {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 17px;
    color: white; background: linear-gradient(165deg, #5874e3, var(--action) 72%); border-color: #5e7eea66;
    box-shadow: 0 5px 15px #304fc13d, inset 0 1px #ffffff4a;
  }
  .primary[aria-busy="true"]::after {
    content: ""; width: 13px; height: 13px; margin-left: 8px;
    border: 2px solid #ffffff66; border-right-color: white; border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  .examples button { font-size: 13px; padding: 5px 11px; }
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .settings > div { min-width: 0; }
  .error { color: var(--danger); margin-top: 10px; }
  .error:empty { margin: 0; }
  #empty { border-radius: 17px; background: var(--field); padding: 16px; }
  .summary { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 13px; color: var(--muted); }
  .pill {
    display: inline-flex; gap: 7px; align-items: center; padding: 6px 11px;
    color: var(--accent); background: var(--field); border-radius: 999px; font-size: 13px; font-weight: 700;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill[data-state="running"]::before { animation: pulse 1.45s ease-in-out infinite; }
  .pill[data-state="succeeded"] { color: var(--positive); background: var(--positive-bg); }
  .pill[data-state="needs_input"] { color: var(--warn); background: var(--warn-bg); }
  .pill[data-state="failed"] { color: var(--danger); background: var(--danger-bg); }
  .monospace { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .small { font-size: 12px; }
  .log { margin: 0; padding: 0; list-style: none; }
  .log li {
    position: relative; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px;
    padding: 9px 0 10px 21px; border-bottom: 1px solid var(--edge); overflow-wrap: anywhere;
  }
  .log li::before {
    content: ""; position: absolute; top: 15px; left: 3px; width: 8px; height: 8px;
    border-radius: 3px; transform: rotate(45deg); background: var(--accent);
  }
  .log li:last-child { border-bottom: 0; }
  .log li.arriving { animation: reveal .25s var(--ease) both; }
  .log b { font-size: 14px; }
  .log .muted { grid-column: 1 / -1; }
  #clarification label:not(:first-child), #clarification .sources + label { margin-top: 12px; }
  #result p { margin-bottom: 8px; }
  .checkbox { display: flex; min-height: 44px; gap: 10px; align-items: center; margin: 7px 0 0; cursor: pointer; }
  .checkbox input { width: 22px; height: 22px; margin: 0; accent-color: var(--action); }
  .sources { margin: 12px 0 0; padding-left: 20px; }
  .sources li { margin-top: 7px; font-size: 13px; overflow-wrap: anywhere; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .metrics div { min-width: 0; background: var(--field); padding: 12px; border-radius: 15px; }
  .metrics dt { color: var(--muted); font-size: 12px; }
  .metrics dd { margin: 4px 0 0; font-variant-numeric: tabular-nums; font-size: clamp(14px, 3.5vw, 19px); font-weight: 650; overflow-wrap: anywhere; }
  @keyframes reveal { from { opacity: 0; transform: translateY(7px); } }
  @keyframes pulse { 50% { opacity: .4; transform: scale(.8); } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 16px; }
    nav, main { width: calc(100% - 30px); }
    main { padding-top: 28px; }
    .panel { padding: 17px; border-radius: 23px; }
  }
  @media (max-width: 480px) { .settings { grid-template-columns: 1fr; } }
  @media (max-width: 365px) { .brand-mark { display: none; } nav a { padding-inline: 10px; } }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #111827; --light: #151e31; --aurora: #28375c; --wash: #163637;
      --ink: #eef3ff; --muted: #acbbd5; --accent: #b2c3ff;
      --surface: #192234f5; --field: #212d44; --glass: #1b253ce6;
      --edge: #b7cfff29; --shine: #afc7ff2b; --shadow: #0006;
      --positive: #a3e3cc; --positive-bg: #233e3b;
      --warn: #f3d29e; --warn-bg: #41382e;
      --danger: #ffc0cf; --danger-bg: #492b3a;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    nav { background: var(--light); backdrop-filter: none; }
    .panel { background: var(--light); }
  }
</style>
</head>
<body>
<header>
  <nav>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>Materials Agent</strong></div>
    <div class="nav-actions"><a href="#execution">执行记录</a><a href="/docs">API 文档</a></div>
  </nav>
</header>
<main>
  <div class="intro"><h1>材料计算工作台</h1><p class="muted">查询材料资料、提交计算并查看执行记录。</p></div>
  <div class="layout">
    <div>
      <section class="panel">
        <h2>提交请求</h2>
        <form id="request">
          <label for="message">材料问题或计算指令</label>
          <textarea id="message" required maxlength="1200" placeholder="例如：提交硅的能量计算"></textarea>
          <div class="examples">
            <button type="button" data-example="查一下硅的资料">查材料资料</button>
            <button type="button" data-example="硅的晶体结构是什么？">查晶体结构</button>
            <button type="button" data-example="提交硅的能量计算">提交计算</button>
            <button type="button" data-example="先查硅的资料，再提交能量计算">先查再计算</button>
            <button type="button" data-example="提交能量计算">演示缺参数</button>
            <button type="button" data-example="先查铝的资料，再提交几何优化" data-backend="ase">铝结构优化</button>
          </div>
          <div class="settings">
            <div>
              <label for="backend">计算后端</label>
              <select id="backend">
                <option value="mock">模拟任务（含故障场景）</option>
                <option value="ase">ASE / EMT（铝）</option>
              </select>
            </div>
            <div>
              <label for="scenario">计算模拟场景</label>
              <select id="scenario">
                <option value="normal">正常运行</option>
                <option value="timeout_once">第一次超时，重试成功</option>
                <option value="always_timeout">两次超时</option>
              </select>
            </div>
          </div>
          <label class="checkbox"><input id="approval" type="checkbox"> 普通计算也需要人工确认</label>
          <button class="primary" id="submit" type="submit">运行 Agent</button>
          <p id="message-error" class="error small" role="alert"></p>
        </form>
      </section>
      <section class="panel" id="clarification" hidden>
        <h2 id="clarification-title">补充参数</h2>
        <form id="resume"><div id="fields"></div><button class="primary">继续执行</button><p id="resume-error" class="error small" role="alert"></p></form>
      </section>
      <section class="panel" id="result-panel" hidden><h2>结果</h2><div id="result"></div></section>
    </div>
    <section class="panel" id="execution">
      <h2>执行记录</h2>
      <p id="empty" class="muted">提交请求后显示 Agent 节点和后台任务事件。</p>
      <div id="activity" hidden>
        <span id="status" class="pill" role="status"></span>
        <div class="summary small">
          <span>运行 ID <span id="run-id" class="monospace"></span></span>
          <span id="task-label" hidden>任务 ID <span id="task-id" class="monospace"></span></span>
          <span id="attempts"></span>
        </div>
        <h3>Agent 节点</h3><ol class="log" id="trace"></ol>
        <div id="worker-panel" hidden><h3>后台任务</h3><ol class="log" id="events"></ol></div>
      </div>
    </section>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const materialEntries = [["silicon", "硅"], ["aluminum", "铝"], ["iron", "铁"]];
  const calculationEntries = [["energy", "能量计算"], ["relaxation", "几何优化"]];
  const fieldLabels = { material: "材料", calculation: "计算类型" };
  const stepLabels = { plan: "解析请求", clarify: "接收补充参数", retrieve: "检索与排序", lookup: "生成带引用的回答", approve: "人工确认", queue: "提交计算任务" };
  const eventLabels = { queued: "任务已入队", started: "开始计算", retry_scheduled: "已安排重试", succeeded: "计算成功", failed: "计算失败" };
  const statusLabels = {completed: "工作流完成", needs_input: "等待补充", pending: "流程未完成", queued: "任务已入队", running: "计算中", succeeded: "任务成功", failed: "任务失败"};
  let viewVersion = 0;
  let displayedRun;
  let retry;
  let eventStream;

  async function api(path, method = "GET", body, key) {
    const headers = body ? {"Content-Type": "application/json"} : {};
    if (key) headers["Idempotency-Key"] = key;
    const response = await fetch(path, {method, headers, body: body && JSON.stringify(body)});
    const payload = await response.json();
    if (!response.ok) throw new Error(typeof payload.detail === "string" ? payload.detail : "请求参数有误");
    return payload;
  }
  function addRow(container, name, detail, timing, arriving = false) {
    const item = document.createElement("li");
    if (arriving) item.className = "arriving";
    const title = document.createElement("b");
    title.textContent = name;
    const time = document.createElement("span");
    time.className = "monospace small";
    time.textContent = timing == null ? "" : timing + " ms";
    item.append(title, time);
    if (detail) {
      const description = document.createElement("span");
      description.className = "muted";
      description.textContent = detail;
      item.append(description);
    }
    container.append(item);
  }
  function showStatus(status) {
    const badge = $("status");
    if (badge.dataset.state === status) return;
    badge.dataset.state = status;
    badge.textContent = statusLabels[status];
  }
  function populateFields(fields, pending, evidence) {
    $("fields").replaceChildren();
    $("resume-error").textContent = "";
    $("clarification-title").textContent = pending ? "确认计算任务" : "补充参数";
    if (evidence.length) $("fields").append(sourceList(evidence));
    for (const field of fields) {
      const label = document.createElement("label");
      label.htmlFor = "field-" + field;
      label.textContent = field === "approved"
        ? [new Map(materialEntries).get(pending.material), new Map(calculationEntries).get(pending.calculation),
           pending.backend === "ase" ? "ASE / EMT" : "模拟任务"].join(" · ")
        : fieldLabels[field];
      const select = document.createElement("select");
      select.id = label.htmlFor;
      select.name = field;
      const entries = field === "approved" ? [["true", "批准提交"], ["false", "拒绝提交"]]
        : field === "material" ? materialEntries : calculationEntries;
      if (field === "approved") {
        select.required = true;
        select.add(new Option("请选择", "", true, true));
      }
      for (const [value, text] of entries) select.add(new Option(text, value));
      $("fields").append(label, select);
    }
  }
  function sourceList(evidence, citations = []) {
    const sources = document.createElement("ul");
    sources.className = "sources";
    for (const item of evidence) {
      const row = document.createElement("li");
      const label = item.url ? document.createElement("a") : document.createElement("span");
      label.textContent = item.title + (citations.includes(item.id) ? "（已引用）" : "");
      if (item.url) {
        label.href = item.url;
        label.target = "_blank";
        label.rel = "noreferrer";
      }
      row.append(label);
      sources.append(row);
    }
    return sources;
  }
  function present(run) {
    const version = ++viewVersion;
    eventStream?.close();
    displayedRun = run.run_id;
    const url = new URL(location.href);
    url.searchParams.set("run", run.run_id);
    history.replaceState(null, "", url);
    $("empty").hidden = true;
    $("activity").hidden = false;
    $("run-id").textContent = run.run_id.slice(0, 12);
    $("run-id").title = run.run_id;
    $("trace").replaceChildren();
    $("events").replaceChildren();
    $("task-label").hidden = true;
    $("worker-panel").hidden = true;
    $("result-panel").hidden = true;
    $("attempts").textContent = "";
    showStatus(run.status);
    $("clarification").hidden = run.status !== "needs_input";
    if (run.status === "needs_input") populateFields(run.missing, run.pending_parameters, run.pending_evidence || []);
    for (const step of run.trace) {
      const parameters = step.parameters || {};
      const details = [
        (step.action && ({lookup:"资料查询", calculate:"材料计算", research_calculate:"查资料后计算"})[step.action]),
        new Map(materialEntries).get(parameters.material || step.material),
        new Map(calculationEntries).get(parameters.calculation),
        step.evidence_ids?.join(", "),
        step.approved === undefined ? "" : step.approved ? "已批准" : "已拒绝",
        step.metrics?.mode === "model" ? (
          step.metrics.model + " · " + (step.metrics.total_tokens == null ? "供应商未提供用量" : step.metrics.total_tokens + " tokens")
        ) : step.metrics?.mode === "offline" ? "离线模式" : "",
      ].filter(Boolean).join(" · ");
      addRow($("trace"), stepLabels[step.step], details, step.elapsed_ms);
    }
    if (run.result?.kind === "reference") {
      const paragraph = document.createElement("p");
      paragraph.textContent = run.result.answer;
      const citations = run.result.citations ?? [];
      const evidence = run.result.evidence ?? (run.result.reference ? [run.result.reference] : []);
      $("result").replaceChildren(paragraph, sourceList(evidence, citations));
      $("result-panel").hidden = false;
    } else if (run.result?.kind === "task") {
      if (run.result.evidence?.length) {
        $("result").replaceChildren(sourceList(run.result.evidence));
        $("result-panel").hidden = false;
      }
      watchTask(run.result.task_id, version, run.result.evidence || []);
    } else if (run.result?.kind === "declined") {
      $("result").textContent = "审批已拒绝，计算任务未创建。";
      $("result-panel").hidden = false;
    } else if (run.result?.kind === "unsupported") {
      $("result").textContent = "ASE / EMT 后端目前仅支持铝。可切换到模拟任务后重试。";
      $("result-panel").hidden = false;
    }
  }
  async function watchTask(taskId, version, evidence) {
    const task = await pollTask(taskId, version, evidence, false);
    if (!task || isDone(task.status) || version !== viewVersion) return;
    let cursor = task.events.at(-1)?.id ?? 0;
    let failures = 0;
    const stream = new EventSource("/api/tasks/" + taskId + "/events?after=" + cursor);
    eventStream = stream;
    stream.addEventListener("task_event", message => {
      if (version !== viewVersion) return;
      const event = JSON.parse(message.data);
      if (event.id <= cursor) return;
      failures = 0;
      cursor = event.id;
      renderEvent(event, true);
      $("attempts").textContent = "已执行 " + event.attempt + " 次";
      if (event.event === "started") showStatus("running");
      if (event.event === "retry_scheduled") showStatus("queued");
    });
    stream.addEventListener("done", () => {
      stream.close();
      pollTask(taskId, version, evidence, false);
    });
    stream.onerror = () => {
      if (++failures >= 2) {
        stream.close();
        pollTask(taskId, version, evidence, true);
      }
    };
  }
  function isDone(status) {
    return status === "succeeded" || status === "failed";
  }
  function renderEvent(event, arriving = false) {
    const error = ({
      "Calculation tool timed out": "计算工具超时",
      "Worker lease expired": "执行进程未按时完成，任务租约过期",
      "Local calculation failed": "本地计算失败",
    })[event.details.error];
    const detail = [event.attempt ? "第 " + event.attempt + " 次尝试" : "", error].filter(Boolean).join(" · ");
    addRow($("events"), eventLabels[event.event] || event.event, detail, event.details.elapsed_ms, arriving);
  }
  function renderResult(task, evidence) {
    const result = task.result;
    if (result.backend === "ase") {
      const summary = document.createElement("p");
      summary.textContent = result.method + " · " + result.atom_count + " 个原子";
      const metrics = document.createElement("dl");
      metrics.className = "metrics";
      for (const [label, value] of [
        ["势能", result.energy_ev.toFixed(4) + " eV"],
        ["最大原子受力", result.max_force_ev_per_angstrom.toFixed(4) + " eV/Å"],
      ]) {
        const metric = document.createElement("div");
        const term = document.createElement("dt");
        const reading = document.createElement("dd");
        term.textContent = label;
        reading.textContent = value;
        metric.append(term, reading);
        metrics.append(metric);
      }
      const optimization = document.createElement("p");
      optimization.textContent = result.converged === null ? "单点能量计算"
        : (result.converged ? "结构优化已收敛" : "达到步数上限") + " · " + result.steps + " 步";
      const download = document.createElement("a");
      download.className = "download";
      download.href = "/api/tasks/" + task.id + "/structure";
      download.textContent = "下载晶体结构（extxyz）";
      $("result").replaceChildren(summary, metrics, optimization, download);
    } else {
      $("result").textContent = "模拟评分 " + result.simulated_score + "（仅用于验证任务执行）";
    }
    if (evidence.length) $("result").append(sourceList(evidence));
    $("result-panel").hidden = false;
  }
  async function pollTask(taskId, version, evidence, repeat) {
    if (version !== viewVersion) return;
    try {
      const task = await api("/api/tasks/" + taskId);
      if (version !== viewVersion) return;
      $("task-id").textContent = task.id.slice(0, 12);
      $("task-id").title = task.id;
      $("task-label").hidden = false;
      $("worker-panel").hidden = false;
      $("attempts").textContent = "已执行 " + task.attempts + " 次";
      showStatus(task.status);
      $("events").replaceChildren();
      task.events.forEach(event => renderEvent(event));
      if (task.result) renderResult(task, evidence);
      if (repeat && !isDone(task.status)) {
        setTimeout(() => pollTask(taskId, version, evidence, true), 250);
      }
      return task;
    } catch (error) {
      if (version === viewVersion) $("message-error").textContent = error.message;
    }
  }
  function updateBackend() {
    const usingASE = $("backend").value === "ase";
    $("scenario").disabled = usingASE;
    if (usingASE) $("scenario").value = "normal";
  }
  function setSubmitting(button, busy) {
    button.disabled = busy;
    button.setAttribute("aria-busy", String(busy));
  }
  $("backend").addEventListener("change", updateBackend);
  document.querySelectorAll("[data-example]").forEach(button => {
    button.onclick = () => {
      $("backend").value = button.dataset.backend || "mock";
      updateBackend();
      $("message").value = button.dataset.example;
      $("message").focus();
    };
  });
  $("request").onsubmit = async event => {
    event.preventDefault();
    const body = {
      message: $("message").value.trim(), scenario: $("scenario").value,
      require_approval: $("approval").checked, backend: $("backend").value,
    };
    if (!body.message) return;
    setSubmitting($("submit"), true);
    $("message-error").textContent = "";
    const fingerprint = JSON.stringify(body);
    if (retry?.fingerprint !== fingerprint) retry = {fingerprint, key: crypto.randomUUID()};
    try {
      const run = await api("/api/runs", "POST", body, retry.key);
      present(run);
      if (run.status === "needs_input") $("fields").querySelector("select")?.focus();
      retry = null;
    } catch (error) {
      $("message-error").textContent = error.message;
    } finally { setSubmitting($("submit"), false); }
  };
  $("resume").onsubmit = async event => {
    event.preventDefault();
    const button = $("resume").querySelector("button");
    setSubmitting(button, true);
    $("resume-error").textContent = "";
    try {
      const values = Object.fromEntries(new FormData(event.target));
      if ("approved" in values) values.approved = values.approved === "true";
      present(await api("/api/runs/" + displayedRun + "/resume", "POST", values));
    } catch (error) {
      $("resume-error").textContent = error.message;
    } finally { setSubmitting(button, false); }
  };
  const existingRun = new URL(location.href).searchParams.get("run");
  if (existingRun && /^[a-f0-9]{32}$/.test(existingRun)) {
    api("/api/runs/" + existingRun).then(present).catch(error => { $("message-error").textContent = error.message; });
  }
</script>
</body>
</html>
